# LLM report generation configuration

providers:
  local:
    model: "Qwen/Qwen2.5-7B-Instruct"
    load_in_4bit: true
    device: "cuda"
    max_new_tokens: 512
    temperature: 0.1

  openai:
    model: "gpt-4o-mini"
    temperature: 0.1
    max_tokens: 512

  anthropic:
    model: "claude-3-5-haiku-20241022"
    temperature: 0.1
    max_tokens: 512

rag:
  enabled: true
  knowledge_base_path: "data/external/policy_docs"
  top_k: 3

report:
  languages: ["en", "zh"]
  sections:
    - applicant_summary
    - risk_assessment
    - key_drivers
    - counterfactual_advice
    - policy_citations
    - compliance_check

evaluation:
  metrics:
    - numeric_accuracy  # do numbers match SHAP values
    - readability_score
    - compliance_language_score
