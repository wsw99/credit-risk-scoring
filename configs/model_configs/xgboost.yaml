# XGBoost configuration

model: xgboost

training:
  objective: "binary:logistic"
  eval_metric: ["auc", "logloss"]
  early_stopping_rounds: 50
  n_estimators: 2000
  verbosity: 0
  random_state: 42
  n_jobs: -1

hyperparameter_space:
  learning_rate:
    type: float
    low: 0.01
    high: 0.3
    log: true
  max_depth:
    type: int
    low: 3
    high: 10
  min_child_weight:
    type: int
    low: 1
    high: 10
  subsample:
    type: float
    low: 0.6
    high: 1.0
  colsample_bytree:
    type: float
    low: 0.6
    high: 1.0
  reg_alpha:
    type: float
    low: 0.0
    high: 1.0
  reg_lambda:
    type: float
    low: 0.0
    high: 1.0
  scale_pos_weight:
    type: float
    low: 1.0
    high: 10.0
