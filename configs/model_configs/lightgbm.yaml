# LightGBM configuration

model: lightgbm

training:
  objective: "binary"
  metric: ["auc", "binary_logloss"]
  boosting_type: "gbdt"
  early_stopping_rounds: 50
  n_estimators: 2000
  verbosity: -1
  random_state: 42
  n_jobs: -1

hyperparameter_space:
  learning_rate:
    type: float
    low: 0.01
    high: 0.3
    log: true
  num_leaves:
    type: int
    low: 15
    high: 255
  min_child_samples:
    type: int
    low: 5
    high: 100
  subsample:
    type: float
    low: 0.6
    high: 1.0
  colsample_bytree:
    type: float
    low: 0.6
    high: 1.0
  reg_alpha:
    type: float
    low: 0.0
    high: 1.0
  reg_lambda:
    type: float
    low: 0.0
    high: 1.0
