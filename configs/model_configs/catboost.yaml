# CatBoost configuration

model: catboost

training:
  loss_function: "Logloss"
  eval_metric: "AUC"
  early_stopping_rounds: 50
  iterations: 2000
  random_seed: 42
  thread_count: -1
  verbose: 0

hyperparameter_space:
  learning_rate:
    type: float
    low: 0.01
    high: 0.3
    log: true
  depth:
    type: int
    low: 3
    high: 10
  l2_leaf_reg:
    type: float
    low: 1.0
    high: 10.0
  border_count:
    type: int
    low: 32
    high: 255
